# LeafScan build configuration (the Python counterpart of a CMake / Maven / Gradle project file).
#
#   pip install -e ".[research]"      # fundamentals + surveillance packages, CLI `leafscan-surveillance`
#   pip install -e ".[web,dev]"       # what the web app and its browser tests need
#   python scripts/check_all.py       # build check + every test suite, each in its own environment
#
# PyTorch wheels: add `--extra-index-url https://download.pytorch.org/whl/cu126` (GPU) or `.../whl/cpu` to the
# pip command; exact versions used for every reported result are pinned in requirements-research.txt and
# "Flask Deployed App/requirements.txt".

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leafscan"
version = "1.1.0"
description = "LeafScan: crop disease and pest surveillance (classification, detection, segmentation, forecasting)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Esh Dobhal" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.2"]  # the fundamentals module needs nothing else

[project.optional-dependencies]
research = [
    "torch==2.9.1", "torchvision==0.24.1", "timm==1.0.20", "huggingface_hub==0.36.2", "scipy==1.18.1",
    "scikit-learn==1.9.1", "pillow==13.0.0", "matplotlib==3.10.7", "torchmetrics==1.8.2", "pycocotools==2.0.10",
    "pyarrow==26.0.1", "opencv-python==5.1.0.95", "PyYAML==6.0.3", "psutil==7.1.3", "onnx==1.19.1",
    "onnxruntime==1.23.2", "imageio-ffmpeg==0.6.0",
]
benchmark = ["ultralytics==8.3.228"]  # AGPL-3.0: YOLO benchmark only, never shipped
web = ["torch==2.9.1", "torchvision==0.24.1", "Flask==3.1.2", "Pillow==11.3.0", "timm==1.0.20", "huggingface_hub==0.36.2", "waitress==3.0.2"]
dev = ["pytest==8.4.2", "playwright==1.55.0"]

[project.scripts]
leafscan-surveillance = "surveillance.cli:main"

[project.urls]
Homepage = "https://github.com/eshdobhal/LEAFSCAN-PLANT-DISEASE-DETECTION"
"Live demo" = "https://eshdobhal.github.io/LEAFSCAN-PLANT-DISEASE-DETECTION/"

[tool.setuptools.packages.find]
include = ["fundamentals*", "surveillance*"]
exclude = ["*.tests*"]
